[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speclang"
version = "0.1.0"
description = "Write system specs as structured YAML, validate them, and generate traceability tables and an OpenAPI skeleton."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.0"]
keywords = ["specification", "requirements", "traceability", "openapi", "linter"]

[project.optional-dependencies]
dev = ["pytest>=7", "openapi-spec-validator>=0.7"]

[project.scripts]
speclint = "speclang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speclang = ["spec.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
