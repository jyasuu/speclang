# Example CI job: lint the spec on every change, publish the generated tables,
# and post a change report on pull requests.
name: spec
on:
  pull_request:
    paths: ["specs/**"]
  push:
    branches: [main]
    paths: ["specs/**"]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install speclang
      - name: Validate spec (warnings fail the build)
        run: speclint specs/ --strict --build build/
      - name: Prose documents are up to date
        run: speclint sync docs/spec.md --spec specs/ --check
      # A breaking API change fails this step. To make it advisory only, append `|| true` to the speclint line.
      - name: Change report and breaking-change check (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          speclint diff /tmp/base/specs specs/ --md --breaking >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: spec-tables
          path: build/
