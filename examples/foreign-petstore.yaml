openapi: 3.0.3
info: { title: Pet Store, version: "2.1" }
security: [{ apiKey: [] }]
paths:
  /pets:
    get:
      summary: List pets
      tags: [pets]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [available, pending, sold] } }
        - { name: limit, in: query, required: true, schema: { type: integer, format: int32 } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Pet" } } } }
        "400": { description: Bad query }
    post:
      tags: [pets]
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
                tags: { type: array, items: { type: string } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/Pet" } } }
        "409": { description: Pet already exists }
  /pets/{petId}:
    get:
      operationId: getPetById
      tags: [pets]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Pet" } } } }
        "404": { description: Not found }
    patch:
      tags: [pets]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/PetUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Pet" } } } }
        "404": { description: Not found }
    delete:
      tags: [pets]
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /health:
    get:
      security: []
      summary: Health check
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
components:
  securitySchemes: { apiKey: { type: apiKey, in: header, name: X-Api-Key } }
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 80, description: "Display name" }
        status: { type: string, enum: [available, pending, sold] }
        weight: { type: number }
        born: { type: string, format: date-time }
        owner: { $ref: "#/components/schemas/Owner" }
        photos: { type: array, items: { type: string } }
        category: { oneOf: [{ type: string }, { type: integer }] }
        attributes: { type: object, additionalProperties: true }
    Owner:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
    PetUpdate:
      allOf:
        - $ref: "#/components/schemas/Owner"
    Status:
      type: string
      enum: [available, pending, sold]
