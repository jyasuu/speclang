# Todo spec, part 03: interfaces. Mirrors spec sections 13 to 16.

errors:
  - { code: VALIDATION_FAILED,    status: 422, meaning: "Field-level errors are listed in the errors array", client: "Show inline field messages" }
  - { code: WEAK_PASSWORD,        status: 422, meaning: "Password is too short or found in the breach list", client: "Explain the rule and ask for another" }
  - { code: INVALID_COMPLETED_AT, status: 422, meaning: "completedAt is in the future", client: "Use server time" }
  - { code: UNAUTHENTICATED,      status: 401, meaning: "Missing or expired access token", client: "Refresh once, then sign in again", global: true }
  - { code: INVALID_CREDENTIALS,  status: 401, meaning: "Email or password is wrong", client: "Show a generic sign-in error" }
  - { code: TOKEN_REUSED,         status: 401, meaning: "A used refresh token was presented again; the token family is revoked", client: "Sign in again" }
  - { code: REAUTH_REQUIRED,      status: 401, meaning: "A recent sign-in is required for this action", client: "Ask the user to re-enter their password" }
  - { code: FORBIDDEN_ROLE,       status: 403, meaning: "Role lacks permission", client: "Show the read-only state" }
  - { code: EMAIL_NOT_VERIFIED,   status: 403, meaning: "Sharing needs a verified email address", client: "Prompt to verify email" }
  - { code: TASK_NOT_FOUND,       status: 404, meaning: "Missing or no access; the two are indistinguishable by design", client: "Remove from the local store" }
  - { code: LIST_NOT_FOUND,       status: 404, meaning: "Missing or no access", client: "Remove from the local store" }
  - { code: SESSION_NOT_FOUND,    status: 404, meaning: "Session does not exist", client: "Refresh the session list" }
  - { code: PLAN_LIMIT,           status: 402, meaning: "Plan limit reached; the body names the limit", client: "Show an upgrade prompt" }
  - { code: ALREADY_DONE,         status: 409, meaning: "Task already completed", client: "Treat as success" }
  - { code: EMAIL_EXISTS,         status: 409, meaning: "An account with this email exists", client: "Offer sign in" }
  - { code: ALREADY_MEMBER,       status: 409, meaning: "The user is already a member of the list", client: "Show the existing member" }
  - { code: TAG_EXISTS,           status: 409, meaning: "A tag with this name exists; the body returns it", client: "Use the existing tag" }
  - { code: LAST_OWNER,           status: 409, meaning: "The last Owner cannot be removed or demoted", client: "Explain and offer ownership transfer" }
  - { code: DEFAULT_LIST,         status: 409, meaning: "The default Inbox cannot be deleted or archived", client: "Explain" }
  - { code: LIST_DELETED,         status: 409, meaning: "The parent list was deleted separately", client: "Offer to restore the list first" }
  - { code: INVITE_EXPIRED,       status: 410, meaning: "Invitation link is expired or already used", client: "Ask the owner to resend" }
  - { code: RESET_LINK_INVALID,   status: 410, meaning: "Password reset link is expired or already used", client: "Offer a new reset email" }
  - { code: CURSOR_EXPIRED,       status: 410, meaning: "Sync cursor is older than the compaction window", client: "Run a full resync" }
  - { code: VERSION_CONFLICT,     status: 412, meaning: "Stale If-Match version; the body includes the current state", client: "Merge with the returned state, then retry" }
  - { code: PAYLOAD_TOO_LARGE,    status: 413, meaning: "Body or file exceeds the limit", client: "Show the size limit" }
  - { code: UNSUPPORTED_TYPE,     status: 415, meaning: "File type is not allowed", client: "Show the allowed types" }
  - { code: ACCOUNT_LOCKED,       status: 423, meaning: "Too many failed sign-ins", client: "Show the wait time" }
  - { code: RATE_LIMITED,         status: 429, meaning: "Too many requests", client: "Back off for the Retry-After period", global: true }
  - { code: INTERNAL,             status: 500, meaning: "Unexpected error", client: "Retry with backoff and show the trace ID in the support dialog", global: true }
  - { code: UNAVAILABLE,          status: 503, meaning: "Failover or maintenance", client: "Retry with backoff", global: true }

operations:
  # Accounts and sessions
  - { id: register, method: POST, path: /auth/register, success: 201, implements: [FR-1, FR-20, FR-62], permission: [Anonymous], errors: [EMAIL_EXISTS, WEAK_PASSWORD, VALIDATION_FAILED], touches: { User: C, List: C, ListMember: C, NotificationPreference: C }, idempotent: true, tx: ["create user with consent flag", "create default Inbox list and owner membership", "create default notification preferences", "queue verification email after commit"], request: RegisterRequest, response: AuthResult }
  - { id: login, method: POST, path: /auth/login, implements: [FR-1], permission: [Anonymous], errors: [INVALID_CREDENTIALS, ACCOUNT_LOCKED, VALIDATION_FAILED], touches: { User: R, Session: C, AuditEvent: C }, idempotent: false, tx: ["verify password hash", "create session and refresh token", "write audit event"], request: LoginRequest, response: AuthResult }
  - { id: oauthSignIn, method: POST, path: "/auth/oauth/{provider}", implements: [FR-3], permission: [Anonymous], errors: [VALIDATION_FAILED, ACCOUNT_LOCKED], touches: { User: CR, Identity: CR, Session: C }, idempotent: false, tx: ["validate provider token and verified email", "create or link user and identity", "create session"], request: OAuthRequest, response: AuthResult }
  - { id: verifyEmail, method: POST, path: /auth/verify-email, implements: [FR-2], permission: [Anonymous], errors: [VALIDATION_FAILED], touches: { User: U }, idempotent: true, request: VerifyEmailRequest, success: 204 }
  - { id: requestPasswordReset, method: POST, path: /auth/password-reset, success: 202, implements: [FR-5], permission: [Anonymous], errors: [], touches: { User: R, AuditEvent: C }, idempotent: true, request: PasswordResetRequest }
  - { id: confirmPasswordReset, method: POST, path: /auth/password-reset/confirm, implements: [FR-5], permission: [Anonymous], errors: [RESET_LINK_INVALID, WEAK_PASSWORD], touches: { User: U, Session: U, AuditEvent: C }, idempotent: true, tx: ["verify single-use token", "set new password hash", "revoke all sessions", "write audit event"], request: PasswordResetConfirm, success: 204 }
  - { id: refreshToken, method: POST, path: /auth/refresh, implements: [FR-6], permission: [Anonymous], errors: [TOKEN_REUSED], touches: { Session: U, AuditEvent: C }, idempotent: false, tx: ["rotate refresh token", "on reuse revoke the token family", "write audit event"], response: AuthResult }
  - { id: logout, method: POST, path: /auth/logout, success: 204, implements: [FR-6], permission: [Authenticated], errors: [], touches: { Session: U }, idempotent: true }
  - { id: getMe, method: GET, path: /me, implements: [FR-1], permission: [Authenticated], errors: [], touches: { User: R }, response: UserProfile }
  - { id: enableMfa, method: POST, path: /me/mfa, implements: [FR-4], permission: [Authenticated], errors: [VALIDATION_FAILED, REAUTH_REQUIRED], touches: { User: U, AuditEvent: C }, idempotent: true, tx: ["verify TOTP code", "store encrypted secret", "write audit event"], request: MfaEnrollRequest, success: 204 }
  - { id: listSessions, method: GET, path: /me/sessions, implements: [FR-6], permission: [Authenticated], errors: [], touches: { Session: R }, response: SessionList }
  - { id: revokeSession, method: DELETE, path: "/me/sessions/{id}", success: 204, implements: [FR-6], permission: [Authenticated], errors: [SESSION_NOT_FOUND], touches: { Session: U, AuditEvent: C }, idempotent: true, tx: ["set revoked_at", "write audit event"] }
  # Lists
  - { id: listLists, method: GET, path: /lists, implements: [FR-20], permission: [Authenticated], errors: [], touches: { List: R, ListMember: R }, response: ListPage, query: [{ name: cursor, type: string }, { name: limit, type: integer }] }
  - { id: createList, method: POST, path: /lists, success: 201, implements: [FR-20], permission: [Authenticated], errors: [VALIDATION_FAILED, PLAN_LIMIT], touches: { List: C, ListMember: C, ChangeLog: C }, idempotent: true, tx: ["insert list", "add creator as Owner", "append change_log"], request: ListCreate, response: List }
  - { id: updateList, method: PATCH, path: "/lists/{id}", implements: [FR-20], permission: [Owner], errors: [FORBIDDEN_ROLE, LIST_NOT_FOUND, VERSION_CONFLICT, VALIDATION_FAILED, DEFAULT_LIST], touches: { ListMember: R, List: U, ChangeLog: C }, concurrency: if-match, tx: ["check version", "rename or archive", "append change_log"], request: ListPatch, response: List }
  - { id: deleteList, method: DELETE, path: "/lists/{id}", success: 204, implements: [FR-20], permission: [Owner], errors: [FORBIDDEN_ROLE, LIST_NOT_FOUND, DEFAULT_LIST], touches: { ListMember: R, List: S, Task: S, Reminder: U, ChangeLog: C, AuditEvent: C }, idempotent: true, tx: ["soft delete list and tasks with one timestamp", "cancel reminders", "append single list.deleted change", "write audit event"] }
  # Tasks, tags and views
  - { id: listTasks, method: GET, path: /tasks, summary: "Query tasks with filters, sort, search and cursor paging", implements: [FR-21, FR-22, FR-23], permission: [Viewer, Editor, Owner], errors: [VALIDATION_FAILED], touches: { ListMember: R, Task: R, Tag: R, TaskTag: R }, response: TaskPage, query: [{ name: list_id, type: uuid }, { name: status, type: "open | done" }, { name: priority, type: "none | low | medium | high" }, { name: tag, type: string }, { name: due_from, type: timestamp }, { name: due_to, type: timestamp }, { name: view, type: "today | upcoming | overdue | completed | all" }, { name: q, type: string, note: "Full-text search over titles, descriptions and tags" }, { name: sort, type: "due | priority | created | manual" }, { name: cursor, type: string }, { name: limit, type: integer }] }
  - { id: getTask, method: GET, path: "/tasks/{id}", implements: [FR-10], permission: [Viewer, Editor, Owner], errors: [TASK_NOT_FOUND], touches: { ListMember: R, Task: R }, response: Task }
  - { id: createTask, method: POST, path: /tasks, success: 201, implements: [FR-10, FR-14], permission: [Editor, Owner], errors: [VALIDATION_FAILED, FORBIDDEN_ROLE, PLAN_LIMIT, LIST_NOT_FOUND], touches: { ListMember: R, Task: C, Tag: RC, TaskTag: C, Reminder: C, ChangeLog: C }, idempotent: true, tx: ["validate and authorize", "insert task at version 1", "create tags and links", "create reminder if requested", "append change_log", "commit then publish live update"], request: TaskCreate, response: Task }
  - { id: updateTask, method: PATCH, path: "/tasks/{id}", implements: [FR-11, FR-17, FR-31], permission: [Editor, Owner], errors: [FORBIDDEN_ROLE, TASK_NOT_FOUND, VERSION_CONFLICT, VALIDATION_FAILED], touches: { ListMember: R, Task: U, TaskTag: CD, Reminder: U, ChangeLog: C }, concurrency: if-match, tx: ["check If-Match version", "apply changed fields and bump version", "sync tag links", "re-arm reminders if due date changed", "append change_log"], request: TaskPatch, response: Task }
  - { id: completeTask, method: POST, path: "/tasks/{id}/complete", implements: [FR-12, FR-15], permission: [Editor, Owner], errors: [FORBIDDEN_ROLE, TASK_NOT_FOUND, ALREADY_DONE, VERSION_CONFLICT, INVALID_COMPLETED_AT], touches: { ListMember: R, Task: UC, Reminder: UC, ChangeLog: C }, idempotent: true, concurrency: if-match, tx: ["lock task and check version", "set done and bump version", "insert next occurrence if recurring", "cancel and re-arm reminders", "append change_log", "commit then publish live update"], request: CompleteTaskRequest, response: CompleteTaskResult }
  - { id: reopenTask, method: POST, path: "/tasks/{id}/reopen", implements: [FR-12], permission: [Editor, Owner], errors: [FORBIDDEN_ROLE, TASK_NOT_FOUND, VERSION_CONFLICT], touches: { ListMember: R, Task: U, Reminder: U, ChangeLog: C }, idempotent: true, concurrency: if-match, tx: ["clear completed_at", "re-arm future reminders", "append change_log"], response: Task }
  - { id: deleteTask, method: DELETE, path: "/tasks/{id}", success: 204, implements: [FR-13], permission: [Editor, Owner], errors: [FORBIDDEN_ROLE, TASK_NOT_FOUND], touches: { ListMember: R, Task: S, Reminder: U, ChangeLog: C }, idempotent: true, tx: ["set deleted_at on task and subtasks", "cancel reminders", "append change_log"] }
  - { id: restoreTask, method: POST, path: "/tasks/{id}/restore", implements: [FR-13], permission: [Editor, Owner], errors: [FORBIDDEN_ROLE, TASK_NOT_FOUND, LIST_DELETED], touches: { ListMember: R, Task: U, Reminder: U, ChangeLog: C }, idempotent: true, tx: ["clear deleted_at where it equals the task deletion time", "re-arm future reminders", "append change_log"], response: Task }
  - { id: createTag, method: POST, path: /tags, success: 201, implements: [FR-22], permission: [Authenticated], errors: [VALIDATION_FAILED, TAG_EXISTS], touches: { Tag: C }, idempotent: true, request: TagCreate, response: Tag }
  - { id: requestAttachmentUpload, method: POST, path: /attachments/upload-url, success: 201, implements: [FR-16], permission: [Editor, Owner], errors: [PAYLOAD_TOO_LARGE, UNSUPPORTED_TYPE, PLAN_LIMIT, TASK_NOT_FOUND, FORBIDDEN_ROLE], touches: { ListMember: R, Task: R, Attachment: C }, idempotent: true, request: UploadUrlRequest, response: UploadUrl }
  - { id: createReminder, method: POST, path: "/tasks/{id}/reminders", success: 201, implements: [FR-40, FR-41], permission: [Editor, Owner], errors: [FORBIDDEN_ROLE, TASK_NOT_FOUND, VALIDATION_FAILED, PLAN_LIMIT], touches: { ListMember: R, Task: R, Reminder: C, ChangeLog: C }, idempotent: true, tx: ["validate absolute or relative time", "insert reminder", "append change_log"], request: ReminderCreate, response: Reminder }
  # Collaboration
  - { id: listMembers, method: GET, path: "/lists/{id}/members", summary: "List members with optional query for the assignee combobox", implements: [FR-30, FR-31], permission: [Viewer, Editor, Owner], errors: [LIST_NOT_FOUND, FORBIDDEN_ROLE], touches: { ListMember: R, User: R }, response: MemberPage, query: [{ name: q, type: string, note: "Prefix match on name or email" }, { name: limit, type: integer }, { name: cursor, type: string }] }
  - { id: inviteMember, method: POST, path: "/lists/{id}/members", success: 201, implements: [FR-2, FR-30], permission: [Owner], errors: [FORBIDDEN_ROLE, EMAIL_NOT_VERIFIED, ALREADY_MEMBER, PLAN_LIMIT, LIST_NOT_FOUND], touches: { User: R, List: R, ListMember: C, ChangeLog: C, AuditEvent: C }, idempotent: true, tx: ["check inviter email is verified", "insert pending membership with token hash", "append change_log", "write audit event", "queue invitation email after commit"], request: InviteRequest, response: Member }
  - { id: acceptInvite, method: POST, path: "/invitations/{token}/accept", implements: [FR-30], permission: [Authenticated], errors: [INVITE_EXPIRED], touches: { ListMember: U, ChangeLog: C }, idempotent: true, tx: ["verify token and expiry", "set accepted_at", "append change_log"], response: Member }
  - { id: setMemberRole, method: PATCH, path: "/lists/{id}/members/{uid}", implements: [FR-30], permission: [Owner], errors: [FORBIDDEN_ROLE, LAST_OWNER, LIST_NOT_FOUND, VERSION_CONFLICT], touches: { ListMember: U, ChangeLog: C, AuditEvent: C }, concurrency: if-match, tx: ["check version", "block demoting the last Owner", "update role", "append change_log", "write audit event"], request: MemberRolePatch, response: Member }
  - { id: removeMember, method: DELETE, path: "/lists/{id}/members/{uid}", success: 204, implements: [FR-30, FR-31], permission: [Owner, Editor, Viewer], errors: [FORBIDDEN_ROLE, LAST_OWNER, LIST_NOT_FOUND], touches: { ListMember: D, Task: U, Reminder: U, ChangeLog: C, AuditEvent: C }, idempotent: true, tx: ["delete membership", "clear assignee on that user's tasks", "cancel that user's reminders", "append change_log", "write audit event"] }
  - { id: createComment, method: POST, path: "/tasks/{id}/comments", success: 201, implements: [FR-32], permission: [Editor, Owner], errors: [FORBIDDEN_ROLE, TASK_NOT_FOUND, VALIDATION_FAILED], touches: { ListMember: R, Task: R, Comment: C, ChangeLog: C }, idempotent: true, tx: ["insert comment", "append change_log"], request: CommentCreate, response: Comment }
  - { id: deleteComment, method: DELETE, path: "/tasks/{id}/comments/{cid}", success: 204, implements: [FR-32], permission: [Editor, Owner], errors: [FORBIDDEN_ROLE, TASK_NOT_FOUND], touches: { Comment: S, ChangeLog: C }, idempotent: true, tx: ["soft delete comment", "append change_log"] }
  - { id: listActivity, method: GET, path: "/lists/{id}/activity", implements: [FR-33], permission: [Viewer, Editor, Owner], errors: [LIST_NOT_FOUND], touches: { ListMember: R, ChangeLog: R }, response: ActivityPage, query: [{ name: cursor, type: string }, { name: limit, type: integer }] }
  # Notifications, sync, privacy
  - { id: updateNotificationPreferences, method: PUT, path: /me/notification-preferences, implements: [FR-42, FR-43], permission: [Authenticated], errors: [VALIDATION_FAILED], touches: { NotificationPreference: CU }, concurrency: none, request: NotificationPreferenceSet, response: NotificationPreferenceSet }
  - { id: pullChanges, method: GET, path: /sync/pull, implements: [FR-50, FR-51], permission: [Viewer, Editor, Owner], errors: [CURSOR_EXPIRED], touches: { ListMember: R, ChangeLog: R }, response: SyncPull, query: [{ name: since, type: bigint, required: true }, { name: limit, type: integer }] }
  - { id: pushChanges, method: POST, path: /sync/push, implements: [FR-50, FR-51, FR-52], permission: [Editor, Owner], errors: [VALIDATION_FAILED, FORBIDDEN_ROLE, VERSION_CONFLICT, PAYLOAD_TOO_LARGE], touches: { ListMember: R, Task: CUS, Comment: CS, Reminder: U, ChangeLog: C }, idempotent: true, tx: ["deduplicate by idempotency key", "apply each change in order with field-level merge", "assign next seq and append change_log", "commit then publish live update"], request: SyncPush, response: SyncPushResult }
  - { id: exportData, method: POST, path: /me/export, success: 202, implements: [FR-60], permission: [Authenticated], errors: [], touches: { ExportJob: C, AuditEvent: C }, idempotent: true, tx: ["create export job", "write audit event", "worker builds JSON and CSV archive and emails a signed link"], response: ExportAccepted }
  - { id: updateConsent, method: PUT, path: /me/consent, implements: [FR-62], permission: [Authenticated], errors: [VALIDATION_FAILED], touches: { User: U, AuditEvent: C }, concurrency: none, tx: ["set or clear marketing_consent_at", "write audit event"], request: ConsentRequest, success: 204 }
  - { id: deleteAccount, method: DELETE, path: /me, success: 202, implements: [FR-61], permission: [Authenticated], errors: [REAUTH_REQUIRED], touches: { User: S, Session: U, Reminder: U, AuditEvent: C }, idempotent: true, tx: ["require recent re-authentication", "mark user deleted and revoke all sessions", "cancel reminders", "write audit event", "schedule the 30-day erasure job"] }

components:
  # Screens (each needs a route and the five required states)
  - { name: OnboardingScreen, kind: screen, route: /onboarding, implements: [FR-1, FR-2, FR-3], uses: [register, oauthSignIn, verifyEmail, login], states: [loading, empty, error, offline, no-permission, default] }
  - { name: InboxScreen, kind: screen, route: "/lists/:listId", implements: [FR-10, FR-11, FR-12, FR-13, FR-17, FR-20, FR-22], uses: [listTasks, createTask, completeTask, reopenTask, deleteTask, restoreTask, updateTask, listLists, createList], states: [loading, empty, error, offline, no-permission, default], shows: [List.name, Task.title, Task.status, Task.due_at] }
  - { name: SmartViewScreen, kind: screen, route: /today, implements: [FR-21], uses: [listTasks, completeTask], states: [loading, empty, error, offline, no-permission, default], shows: [Task.title, Task.due_at] }
  - { name: SearchScreen, kind: screen, route: /search, implements: [FR-23], uses: [listTasks], states: [loading, empty, error, offline, no-permission, default], shows: [Task.title, Task.description] }
  - { name: ListSettingsScreen, kind: screen, route: "/lists/:listId/settings", implements: [FR-20, FR-30, FR-33], uses: [updateList, deleteList, listMembers, inviteMember, setMemberRole, removeMember, listActivity], states: [loading, empty, error, offline, no-permission, default], shows: [Member.display_name, Member.role, ActivityEntry.op] }
  - { name: AccountSettingsScreen, kind: screen, route: /settings/account, implements: [FR-4, FR-5, FR-6, FR-60, FR-61, FR-62], uses: [getMe, enableMfa, listSessions, revokeSession, requestPasswordReset, confirmPasswordReset, exportData, deleteAccount, updateConsent], states: [loading, empty, error, offline, no-permission, default], shows: [UserProfile.email, UserProfile.display_name, Session.device_label, Session.last_seen_at] }
  - { name: NotificationSettingsScreen, kind: screen, route: /settings/notifications, implements: [FR-42, FR-43], uses: [updateNotificationPreferences], states: [loading, empty, error, offline, no-permission, default], shows: [NotificationPreference.type, NotificationPreference.channel, NotificationPreference.enabled] }
  # Components
  - { name: TaskRow, kind: component, implements: [FR-12, FR-13, FR-17], uses: [completeTask, deleteTask, updateTask], states: [default, hover, focus, selected, dragging, pending-sync, error], keyboard: ["Space: toggle complete", "Enter: open", "E: complete", "Delete: remove", "Alt+Up and Alt+Down: reorder"], a11y: ["role checkbox with label Complete: title", "status changes announced in a live region", "drag handle has a keyboard alternative"], shows: [Task.title, Task.status, Task.due_at, Task.priority, Task.tags] }
  - { name: TaskDrawer, kind: component, implements: [FR-11, FR-14, FR-16, FR-32], uses: [getTask, updateTask, requestAttachmentUpload, createComment, deleteComment, createReminder], states: [loading, default, error, offline, no-permission], shows: [Task.title, Task.description, Task.due_at, Task.priority, Task.assignee_id, Comment.body] }
  - { name: InlineAddTask, kind: component, implements: [FR-10], uses: [createTask], states: [default, focus, error] }
  - { name: SyncStatusIndicator, kind: component, implements: [FR-50, FR-51], uses: [pullChanges, pushChanges], states: [synced, syncing, offline, error], shows: [SyncPull.next_seq] }
  - { name: AssigneeCombobox, kind: component, implements: [FR-31], uses: [listMembers, updateTask], states: [closed, loading, results, empty, error, loading-more, read-only, invalid], keyboard: ["Down: open and move", "Enter: select", "Esc: close then clear", "Home and End: jump"], a11y: ["role combobox with aria-activedescendant", "options use role option", "result count announced in a live region"], shows: [Member.display_name, Member.email, Member.avatar_url, Member.role] }
  - { name: TagPicker, kind: component, implements: [FR-22], uses: [createTag, updateTask], states: [closed, loading, results, empty, error], shows: [Tag.name] }
  - { name: FilterBar, kind: component, implements: [FR-22], uses: [listTasks], states: [default, active] }
  - { name: ActivityLog, kind: component, implements: [FR-33], uses: [listActivity], states: [loading, empty, error, default], shows: [ActivityEntry.op, ActivityEntry.entity_type] }
